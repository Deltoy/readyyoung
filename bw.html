<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성수레디영 부외품</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#155EEF">
<link rel="manifest" href="bw.webmanifest?v=2">
<link rel="icon" type="image/png" href="ry-icon-192.png">
<link rel="apple-touch-icon" href="ry-apple-touch-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="성수레디영부외품">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<!-- 1109 MJ '부외품 사장님 전용 입고 사이트 — 자신에게 온 주문내역으로 입고만' · 주소 bw.html#t=열쇠 (앱 암호 없음, 서버 BW_TOKEN) · 가격·전화·직원 이름은 서버가 안 보냄
     1109b 기기 승인(1명만 · 다른 폰은 4자리 번호로 약국 승인) · 📒 장부 · 카톡 → 크롬 · 홈 화면 설치 안내
     1109c 챙김 체크(창고에서 체크 → 약국에서 한 번에 입고) · 카드 작게 -->
<style>
:root{--bg:#F5F6F8;--card:#fff;--line:#EDEEF0;--ink:#111827;--sub:#4B5563;--mute:#6B7280;--blue:#155EEF;--blue-d:#0F4BC4;--green:#039855;--green-bg:#ECFDF3;--green-line:#A6F4C5;--red:#D92D20;--amber:#B54708}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,#EAF1FF 0,#F5F6F8 280px) no-repeat,#F5F6F8;color:var(--ink);font:17px/1.5 Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;letter-spacing:-.01em;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
body.has-bar{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{flex:none;width:44px;height:44px;border-radius:12px}
.top .tx{flex:1;min-width:0}
.top .tx small{display:block;font-size:13px;font-weight:600;color:var(--blue);letter-spacing:0}
.top h1{margin:0;font-size:21px;font-weight:800;line-height:1.25}
.icon-btn{flex:none;width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.icon-btn.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
main{max-width:560px;margin:0 auto;padding:12px 16px 16px}
/* 탭 · 칩 */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:0 0 12px;background:#E4E9F2;border-radius:16px}
.seg button{min-height:44px;border:0;border-radius:12px;background:none;font-size:17px;font-weight:700;color:var(--sub)}
.seg button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.chips{display:flex;gap:6px;margin:0 0 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 14px;border:1px solid #D0D5DD;border-radius:999px;background:#fff;font-size:15px;font-weight:600;color:var(--sub)}
.chip[aria-pressed=true]{border-color:var(--blue);background:#EEF4FF;color:var(--blue)}
/* 위 요약 */
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;padding:12px 16px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#155EEF 0%,#2970FF 60%,#4F8BFF 100%);box-shadow:0 6px 18px rgba(21,94,239,.24)}
.hero .hi{margin:0;font-size:17px;font-weight:800}
.hero .dt{margin:0;font-size:15px;opacity:.88}
.hero .hn{text-align:right;flex:none}
.hero .hn b{display:block;font-size:28px;font-weight:800;line-height:1.05}
.hero .hn span{font-size:15px;opacity:.9}
.steps{display:flex;align-items:center;gap:8px;margin:0 2px 10px;font-size:15px;font-weight:600;color:var(--mute)}
.steps i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;margin-right:4px;border-radius:999px;background:#E4E7EC;color:var(--sub);font-size:15px;font-weight:800}
.steps .on{color:var(--ink)}
.steps .on i{background:var(--blue);color:#fff}
/* 주문 카드 (작게: 한 화면 2.5~3개) */
.card{background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);transition:opacity .3s,transform .3s,background-color .2s}
.card.out{opacity:0;transform:scale(.97)}
.card.picked{background:var(--green-bg);box-shadow:0 0 0 2px var(--green-line)}
.head{display:flex;gap:10px;align-items:flex-start}
.head .tx{flex:1;min-width:0}
.tick{flex:none;display:grid;place-items:center;width:56px;height:56px;padding:0;border:2px solid #C5CBD3;border-radius:14px;background:#fff;font-size:15px;font-weight:700;color:var(--sub)}
.tick svg{display:none;width:30px;height:30px}
.tick[aria-pressed=true]{border-color:var(--green);background:var(--green);color:#fff}
.tick[aria-pressed=true] svg{display:block}
.tick[aria-pressed=true] span{display:none}
.thumb{position:relative;overflow:hidden;flex:none;width:56px;height:56px;border-radius:12px;background:#F2F5FA;display:grid;place-items:center;color:#9CA3AF}
.thumb svg{width:26px;height:26px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.head h2{margin:0;font-size:16px;font-weight:700;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-line}
.meta{margin:2px 0 0;font-size:15px;color:var(--sub)}
.meta b{color:var(--ink)}
.new{display:inline-block;margin-right:6px;vertical-align:1px;padding:0 8px;border-radius:999px;background:#EEF4FF;color:var(--blue);font-size:15px;font-weight:700}
.row{display:flex;align-items:center;gap:8px;margin-top:10px}
.step{flex:none;display:flex;align-items:center;border:1px solid #D0D5DD;border-radius:14px;overflow:hidden;background:#fff}
.step button{width:44px;height:44px;border:0;background:#F9FAFB;font-size:24px;font-weight:500;line-height:1}
.step button:active{background:#EEF2F6}
.step input{width:56px;height:44px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-size:19px;font-weight:700;outline:none;-moz-appearance:textfield;background:#fff}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step input:focus{background:#EEF4FF}
.done{flex:1;min-width:0;min-height:44px;padding:0 10px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:700;white-space:nowrap}
.done:active{background:var(--blue-d)}
.done[disabled]{background:#98A2B3}
.diff{margin:6px 2px 0;font-size:15px;color:var(--amber)}
.err{margin:6px 2px 0;font-size:15px;font-weight:600;color:var(--red)}
.photo{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;margin-top:12px;border:2px dashed #B2CCFF;border-radius:14px;background:#F5F8FF;color:var(--blue);font-size:16px;font-weight:700}
.photo svg{width:22px;height:22px}
.pv{display:flex;align-items:center;gap:12px;margin-top:12px;padding:8px;border:1px solid var(--line);border-radius:14px;background:#F9FAFB}
.pv img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.pv .ok{flex:1;font-size:15px;font-weight:600;color:var(--green)}
.pv button{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid #D0D5DD;background:#fff;font-size:15px;font-weight:600}
.empty{text-align:center;padding:28px 20px;background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.empty .ic{width:56px;height:56px;margin:0 auto 10px;border-radius:18px;background:var(--green-bg);color:var(--green);display:grid;place-items:center}
.empty .ic svg{width:28px;height:28px}
.empty h2{margin:0;font-size:18px}
.empty p{margin:4px 0 0;color:var(--mute);font-size:15px}
.big2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin-top:4px;padding:0 18px;border:1.5px dashed #B2CCFF;border-radius:16px;background:#fff;color:var(--blue);font-size:17px;font-weight:700}
.big2 svg{width:22px;height:22px}
/* 아래 고정 바: 챙긴 것 한 번에 입고 */
.bar-fix{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(16,24,40,.08)}
.bar-fix .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar-fix .lb{flex:none;font-size:16px;font-weight:600;color:var(--sub)}
.bar-fix .lb b{color:var(--green);font-size:19px}
.bar-fix .go{flex:1;min-height:52px;border:0;border-radius:14px;background:var(--green);color:#fff;font-size:17px;font-weight:800}
.bar-fix .go[disabled]{background:#98A2B3}
.bar-fix .pg{display:block;height:4px;margin-top:8px;border-radius:2px;background:#E4E7EC;overflow:hidden}
.bar-fix .pg i{display:block;height:100%;background:var(--green);transition:width .3s}
/* 아래에서 올라오는 창 */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(16,24,40,.45)}
.sheet .pn{width:100%;max-width:560px;max-height:86vh;overflow:auto;padding:20px 16px calc(16px + env(safe-area-inset-bottom));background:#fff;border-radius:22px 22px 0 0}
.sheet h2{margin:0 0 12px;font-size:20px}
.sheet ul{list-style:none;margin:0;padding:0}
.sheet li{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-top:1px solid var(--line);font-size:16px}
.sheet li:first-child{border-top:0}
.sheet li b{flex:none}
.sheet li small{display:block;color:var(--amber);font-size:15px}
.btns{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:16px}
.btns button{min-height:52px;border-radius:14px;font-size:17px;font-weight:700}
.btns .no{border:1px solid #D0D5DD;background:#fff}
.btns .ok{border:0;background:var(--green);color:#fff}
.btns.one{grid-template-columns:1fr}
.btns.one .ok{background:var(--blue)}
/* 장부 */
.sum{margin:0 0 12px;padding:14px 16px;border-radius:18px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05)}
.sum .big{margin:0;font-size:20px;font-weight:800}
.sum .big b{color:var(--blue)}
.sum .one{margin:2px 0 0;font-size:15px;color:var(--sub)}
.sum .one b{color:var(--ink)}
.cust{display:flex;align-items:center;gap:6px;margin:0 0 12px}
.cust input{flex:1;min-width:0;height:44px;padding:0 8px;border:1px solid #D0D5DD;border-radius:12px;background:#fff;font-size:15px}
.cust button{flex:none;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:15px;font-weight:700}
.day{margin:0 0 10px;border-radius:18px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.06);overflow:clip}
.day h3{position:sticky;top:calc(65px + env(safe-area-inset-top));z-index:2;display:flex;justify-content:space-between;margin:0;padding:10px 14px;background:#F8FAFC;border-bottom:1px solid var(--line);font-size:15px;font-weight:700}
.day h3 span{font-weight:600;color:var(--mute)}
.day ul{list-style:none;margin:0;padding:0}
.day li{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px;border-top:1px solid var(--line)}
.day li:first-child{border-top:0}
.day .nm{flex:1;min-width:0;font-size:16px;font-weight:600;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.day .q{flex:none;font-size:17px;font-weight:800}
.day .cm{flex:none;display:grid;color:var(--mute)}
.day .cm svg{width:18px;height:18px}
.tg{display:inline-block;margin-right:6px;padding:0 7px;border-radius:999px;background:#F2F4F7;color:var(--sub);font-size:15px;font-weight:700;vertical-align:1px}
.tg.new2{background:var(--green-bg);color:var(--green)}
.lnk{display:block;min-height:44px;margin:4px auto 0;padding:0 16px;border:0;background:none;color:var(--blue);font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
/* 찾기 · 새 상품 */
.bar{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.bar b{display:block;font-size:19px}
.bar small{display:block;font-size:15px;color:var(--mute)}
.back{flex:none;width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.back svg{width:22px;height:22px}
.srch{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;background:#fff;border:1px solid #D0D5DD;border-radius:20px}
.srch:focus-within{box-shadow:0 0 0 4px rgba(21,94,239,.15);border-color:var(--blue)}
.srch .si{flex:none;color:var(--mute);display:grid}
.srch .si svg{width:20px;height:20px}
.srch input{flex:1;min-width:0;height:48px;border:0;outline:none;font-size:18px;background:none}
.srch .go{flex:none;min-height:48px;padding:0 18px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:700}
.hint,.none{margin:14px 4px;color:var(--mute);font-size:15px}
.none{color:var(--ink);font-weight:600}
.count{margin:12px 2px 8px;font-size:15px;color:var(--sub)}
.count b{color:var(--ink)}
.res{list-style:none;margin:0;padding:0;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.res li+li{border-top:1px solid var(--line)}
.res button{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:8px 14px;border:0;background:none;text-align:left}
.res button:active{background:#F5F8FF}
.res button[disabled]{opacity:.55;cursor:default}
.res .thumb{width:48px;height:48px}
.res .rn{flex:1;min-width:0;font-size:16px;font-weight:600;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-line}
.res .rn small{display:block;font-size:15px;font-weight:500;color:var(--amber)}
.res .pk{flex:none;padding:6px 12px;border-radius:999px;background:#EEF4FF;color:var(--blue);font-size:15px;font-weight:700}
.newbox{margin-top:16px;text-align:center}
.fl{display:block;margin:14px 2px 6px;font-size:15px;font-weight:600}
.fl:first-child{margin-top:0}
.fl em{font-style:normal;font-size:15px;color:var(--red);margin-left:4px}
.fl span{font-weight:500;color:var(--mute)}
.fi{width:100%;height:52px;padding:0 14px;border:1px solid #D0D5DD;border-radius:14px;background:#fff;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
select.fi{background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%236B7280" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>') no-repeat right 14px center}
.fi:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(21,94,239,.15)}
/* 안내 화면 (링크 · 승인 대기 · 카톡) */
.gate{max-width:420px;margin:12vh auto 0;padding:28px 20px;text-align:center;background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05)}
.gate h2{margin:0 0 8px;font-size:20px}
.gate p{margin:0;color:var(--sub)}
.gate .code{margin:0 0 6px;font-size:56px;font-weight:800;letter-spacing:.12em;color:var(--ink);font-variant-numeric:tabular-nums}
.gate .say{font-size:18px;font-weight:600;color:var(--ink)}
.gate .done{display:block;width:100%;min-height:56px;margin-top:18px;font-size:18px;text-decoration:none;line-height:56px}
.gate .tip{margin-top:14px;font-size:16px}
/* 홈 화면 설치 안내 띠 */
.inst{margin:0 0 12px;padding:12px;border-radius:18px;background:#fff;box-shadow:0 0 0 2px #B2CCFF}
.inst .t{display:flex;align-items:center;gap:10px}
.inst img{flex:none;width:40px;height:40px;border-radius:10px}
.inst p{flex:1;margin:0;font-size:16px;font-weight:700;line-height:1.35;word-break:keep-all}
.inst .x{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:#F2F4F7;font-size:22px;line-height:1;color:var(--sub)}
.inst .done{width:100%;margin-top:10px;min-height:48px}
.howto ol{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.howto li{display:block;padding:12px;border:1px solid var(--line);border-radius:16px;font-size:17px;font-weight:600}
.howto li>span{display:flex;align-items:center;gap:8px}
.howto li>span i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:999px;background:var(--blue);color:#fff;font-size:14px;font-weight:800}
.mock{margin-top:10px;border-radius:12px;background:#F2F4F7;padding:8px;font-size:15px;font-weight:500}
.mock .ub{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#fff}
.mock .ub span{flex:1;color:var(--mute);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mock .hl{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 8px;border-radius:999px;box-shadow:0 0 0 3px #F79009;font-weight:800;color:var(--ink)}
.mock .mn{display:grid;gap:2px;padding:6px;border-radius:10px;background:#fff}
.mock .mn div{padding:8px 10px;border-radius:8px;color:var(--mute)}
.mock .mn div.hl2{color:var(--ink);font-weight:700;box-shadow:0 0 0 3px #F79009}
.foot{display:flex;align-items:center;justify-content:center;gap:6px;max-width:560px;margin:8px auto 0;padding:16px;font-size:12px;letter-spacing:.04em;color:#6e6e73}
.foot img{border-radius:5px}
.foot b{font-weight:700}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));z-index:40;max-width:calc(100% - 32px);transform:translate(-50%,-140%);padding:12px 20px;border-radius:999px;background:var(--ink);color:#fff;font-size:16px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:transform .25s;pointer-events:none;text-align:center}
#toast:not(.on){opacity:0}
#toast.on{transform:translate(-50%,0)}
#toast.ok{background:var(--green)}
#toast.bad{background:var(--red)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sk{border-radius:18px;background:linear-gradient(90deg,#E9EDF3 0%,#F4F6FA 50%,#E9EDF3 100%);background-size:200% 100%;animation:skm 1.2s linear infinite;margin-bottom:10px}
.sk-hero{height:76px;background:linear-gradient(90deg,#C9D9FF 0%,#DDE7FF 50%,#C9D9FF 100%);background-size:200% 100%}
.sk-card{height:128px}
@keyframes skm{to{background-position:-200% 0}}
.sw-btn{flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:14px;background:#EEF4FF;color:#155EEF;font-size:15px;font-weight:700;text-decoration:none;white-space:nowrap}
#undo{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));z-index:21;width:calc(100% - 32px);max-width:528px;transform:translate(-50%,160%);display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;border-radius:18px;background:#101828;color:#fff;font-size:16px;font-weight:600;box-shadow:0 10px 28px rgba(0,0,0,.25);transition:transform .25s}
#undo.on{transform:translate(-50%,0)}
#undo:not(.on){pointer-events:none;visibility:hidden;transition:transform .25s,visibility 0s .25s}   /* 1109 숨은 띠가 아래 [한 번에 입고 완료]를 가로막던 것 */#undo span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#undo button{flex:none;min-height:44px;padding:0 16px;border:0;border-radius:12px;background:#FDE272;color:#101828;font-size:16px;font-weight:800}
body.has-bar #undo{bottom:calc(92px + env(safe-area-inset-bottom))}
/* 1109 관리자 보기(문준 PC 등): 보기만 — 입고·챙김·찾기 버튼 숨김 */
.bw-adm .done,.bw-adm .step,.bw-adm .tick,.bw-adm [data-a=find],.bw-adm #fix,.bw-adm .steps,.bw-adm .inst,.bw-adm #inst{display:none!important}
.bw-adm .top-in::after{content:"관리자 보기 · 읽기 전용";flex:none;order:2;padding:4px 10px;border-radius:999px;background:#FEF0C7;color:#B54708;font-size:13px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<header class="top"><div class="top-in">
  <img class="logo" src="ry-icon-192.png" alt="" width="44" height="44">
  <div class="tx"><small>성수레디영약국</small><h1>부외품 입고</h1></div>
  <a class="sw-btn" id="toMain" href="./" hidden>전체 물류앱</a>   <!-- 1109 MJ "나는 부외품과 전체 물류앱을 전환" — 이 기기에서 물류앱 이름이 고른 사람(s_selected_member)만 보임 -->
  <button type="button" class="icon-btn" id="reload" aria-label="새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg></button>
</div></header>
<main id="app"><div class="sk sk-hero"></div><div class="sk sk-card"></div><div class="sk sk-card"></div></main>
<footer class="foot"><img src="ry-icon-192.png" alt="" width="18" height="18">성수레디영약국 · 만든 사람 <b>조문준</b></footer>
<div id="fix"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="undo" role="status" aria-live="polite"></div>
<input type="file" id="cam" accept="image/*" capture="environment" class="sr" tabindex="-1" aria-hidden="true">
<script>
/* 1109b MJ '사장님 폰은 안드로이드' — 카톡 안 브라우저면 서버를 부르기 전에 크롬으로 (카톡 안에서 열면 그 창이 기기로 등록되는 것 막기)
   주소 #t= 그대로 넘김 · 안 넘어가면 메뉴 안내 · 아이폰 카톡은 안내만 (pages-shim.js 와 같은 방식) */
(function () {
  var ua = navigator.userAgent || '';
  if (!/KAKAOTALK/i.test(ua)) return;
  window.BW_KAKAO = true;
  var and = /Android/i.test(ua), url = location.href;
  var chrome = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
  var tried = false;
  try { tried = sessionStorage.getItem('bw_kx') === '1'; sessionStorage.setItem('bw_kx', '1'); } catch (e) {}
  document.getElementById('reload').hidden = true;
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  document.getElementById('app').innerHTML = '<div class="gate"><h2>' + (and ? '크롬에서 열어 주세요' : '사파리에서 열어 주세요') + '</h2>'
    + (and ? '<a class="done" href="' + esc(chrome) + '">크롬으로 열기</a><p class="tip">안 넘어가면: 오른쪽 위 <b>⋮</b> → <b>다른 브라우저로 열기</b></p>'
      : '<p class="tip">오른쪽 아래 <b>···</b> → <b>다른 브라우저로 열기</b></p>') + '</div>';
  if (and && !tried) try { location.href = chrome; } catch (e) {}
})();
</script>
<script>
(function () {
  if (window.BW_KAKAO) return;
  var API = 'https://script.google.com/macros/s/AKfycbwvMFIQhV_N1TEso50QSVN7vdMCRXmOUPXDep8p7pKQs1bHvIye7LXbUDANLhzn3pDo/exec';
  var MAX_B64 = 1500000;
  var CATS = ['식품·음료', '위생·소모품', '바디케어', '구강용품', '의약외품', '산리오'];   /* 서버 BW_CATS_ 와 같게 */
  var SV = function (p, w) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>'; };
  var IC = {
    box: SV('<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/>', 1.5),
    cam: SV('<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>', 1.8),
    check: SV('<path d="M20 6 9 17l-5-5"/>', 3),
    plus: SV('<path d="M12 5v14"/><path d="M5 12h14"/>', 2.2),
    back: SV('<path d="m15 18-6-6 6-6"/>'),
    search: SV('<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>')
  };
  /* 열쇠: 주소 #t= · 없으면 이 기기에 기억한 것 (안드로이드 설치 앱은 bw.html 로 열림) */
  var TOK = (location.hash.match(/[#&]t=([A-Za-z0-9]{24,64})/) || [])[1] || '';
  try { if (TOK) localStorage.setItem('bw_t', TOK); else TOK = localStorage.getItem('bw_t') || ''; } catch (e) {}
  /* 1109 MJ '컴퓨터에서도 보게' — 사장님 링크가 없는 기기라도 물류앱을 '문준'으로 쓰는 기기면 앱 암호로 '관리자 보기'(읽기 전용, 기기 자리 안 씀) */
  var ADM = ''; try { if (!TOK && localStorage.getItem('s_selected_member') === '문준') ADM = localStorage.getItem('ry_pages_k') || ''; } catch (e) {}
  if (ADM) document.documentElement.classList.add('bw-adm');
  try { var _me = localStorage.getItem('s_selected_member') || ''; if (_me === '문준') {   /* 1109 MJ '전환은 나만 · 사장님은 못 하게' */ var _tm = document.getElementById('toMain'); _tm.hidden = false; _tm.href = './?me=' + encodeURIComponent(_me); } } catch (e) {}
  /* 1109b 기기 번호 (서버가 승인한 폰만) — 이 폰에서 처음 한 번 만들고 계속 씀 */
  var DEV = ''; try { DEV = localStorage.getItem('bw_dev') || ''; } catch (e) {}
  if (!/^[0-9a-f]{32}$/.test(DEV)) {
    var rb16 = new Uint8Array(16); crypto.getRandomValues(rb16);
    DEV = Array.prototype.map.call(rb16, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    try { localStorage.setItem('bw_dev', DEV); } catch (e) {}
  }
  var UA = navigator.userAgent || '';
  var app = document.getElementById('app'), ITEMS = [], ST = {}, CUR = {}, loadedAt = 0, busy = false, camFor = null, AUTH = '', pendT = 0;
  /* 화면: list(주문 온 것) | ledger(장부) · find(① 상품 찾기) → pick(② 수량) | new(새 상품 등록) · 폰 뒤로 가기 = 한 단계 뒤로 */
  var VIEW = 'list', DEPTH = 0, Q = '', RES = null, PICK = null, NEWF = { name: '', cat: '', note: '' }, searching = false, FILT = 'all';
  var LED = { per: 'this', from: '', to: '', data: null, at: 0, loading: false };
  var RUN = null;   /* 한 번에 입고 진행 { n, i } */

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function key(it) { return it.row + '|' + it.name; }
  function first(s) { return String(s || '').split('\n')[0]; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function call(fn, args, n) {
    n = n || 0;
    var body = ADM ? { rpc: ({ bwList: 'bwListAdmin', bwLedger: 'bwLedgerAdmin' })[fn] || '-', k: ADM, args: ['문준'].concat(args || []) } : { rpc: fn, t: TOK, d: DEV, u: UA.slice(0, 300), args: args || [] };
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.text(); })
      .then(function (t) { try { return JSON.parse(t); } catch (e) { throw new Error('busy'); } })
      .catch(function (e) {
        if (n < 2) return wait(n ? 5000 : 2000).then(function () { return call(fn, args, n + 1); });   /* 같은 입고를 다시 보내도 서버가 '이미 입고' 로 막음 */
        throw new Error('인터넷이 잠깐 끊겼어요. 잠시 뒤 다시 눌러 주세요.');
      });
  }
  var toastT = 0;
  function toast(msg, kind) {
    var el = document.getElementById('toast'); el.textContent = msg; el.className = (kind || '') + ' on';
    clearTimeout(toastT); toastT = setTimeout(function () { el.className = kind || ''; }, 3000);
  }
  function gate(title, msg) {
    AUTH = 'gate'; clearTimeout(pendT); fixBar();
    app.innerHTML = '<div class="gate"><h2>' + esc(title) + '</h2><p>' + esc(msg) + '</p></div>';
    document.getElementById('reload').hidden = true;
  }
  /* 1109b MJ '다른 사람이 쓰려면 나한테 승인' — 번호 하나 + 한 줄만, 30초마다 저절로 다시 확인 */
  function pending(code) {
    AUTH = 'pending'; fixBar();
    app.innerHTML = '<div class="gate" id="pend"><p class="code">' + esc(code) + '</p><p class="say">약국에 이 번호를 알려 주세요</p></div>';
    document.getElementById('reload').hidden = true;
    clearTimeout(pendT); pendT = setTimeout(function () { if (AUTH === 'pending') load(true); }, 30000);
  }
  /* 서버가 막았으면 알맞은 화면을 띄우고 true */
  function authStop(r) {
    if (!r) return false;
    if (r.__auth || r.auth === 1) { gate('링크가 바뀌었어요', '약국에 새 링크를 받아 주세요.'); return true; }
    if (r.auth === 'pending') { pending(r.code); return true; }
    if (r.auth === 'rejected') { gate('이 폰은 쓸 수 없어요', '약국에 연락해 주세요.'); return true; }
    return false;
  }
  function odText(s) { var m = String(s || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); return m ? +m[2] + '월 ' + +m[3] + '일' : ''; }
  function seenGet() { try { return JSON.parse(localStorage.getItem('bw_seen') || '[]'); } catch (e) { return []; } }
  function seenPut(a) { try { localStorage.setItem('bw_seen', JSON.stringify(a.slice(-300))); } catch (e) {} }

  function go(v) { VIEW = v; DEPTH++; try { history.pushState({ v: v, d: DEPTH }, ''); } catch (e) {} render(); scrollTo(0, 0); }
  function home() { if (DEPTH > 0) { try { history.go(-DEPTH); return; } catch (e) {} } VIEW = 'list'; DEPTH = 0; render(); }
  function tab(v) { VIEW = v; try { history.replaceState({ v: v, d: 0 }, ''); } catch (e) {} if (v === 'ledger' && (!LED.data || Date.now() - LED.at > 60000)) ledLoad(); render(); scrollTo(0, 0); }
  window.addEventListener('popstate', function (e) { VIEW = e.state && e.state.v || 'list'; DEPTH = e.state && e.state.d || 0; render(); scrollTo(0, 0); if (VIEW === 'list') load(true); });

  function load(quiet) {
    if (!TOK && !ADM) { gate('링크를 다시 열어 주세요', '약국에서 받은 링크로 열어야 주문 목록이 보여요.'); return; }
    var rb = document.getElementById('reload'); rb.classList.add('spin');
    return call('bwList', []).then(function (r) {
      rb.classList.remove('spin');
      if (authStop(r)) return;
      if (!r || !r.ok) { if (!quiet) toast((r && (r.msg || r.__err)) || '목록을 못 불러왔어요', 'bad'); if (!loadedAt) app.innerHTML = '<div class="gate"><p>목록을 못 불러왔어요 · 오른쪽 위 새로고침을 눌러 주세요</p></div>'; return; }
      if (AUTH === 'pending') toast('승인됐어요', 'ok');
      AUTH = 'ok'; rb.hidden = false; clearTimeout(pendT);
      var _pq = qGet().concat(UNDO ? UNDO.list : []).map(function (x) { return x.row + '|' + x.name; });   /* 1109 MJ '입고 누르면 바로바로' — 보내는 중·되돌리기 5초 안의 상품은 다시 안 보이게 */
      ITEMS = (r.items || []).filter(function (it) { return _pq.indexOf(it.row + '|' + it.name) === -1; }); loadedAt = Date.now();
      var seen = seenGet();
      ITEMS.forEach(function (it) {
        it.kind = 'order'; it.k = key(it); it._new = seen.indexOf(it.k + '|' + it.od) === -1;
        var s = ST[it.k]; if (!s || !s.edited) ST[it.k] = { qty: it.pq || it.qty || 1, photo: s ? s.photo : '', edited: false };
      });
      seenPut(seen.concat(ITEMS.filter(function (it) { return it._new; }).map(function (it) { return it.k + '|' + it.od; })));
      try { if (navigator.setAppBadge) { if (ITEMS.length) navigator.setAppBadge(ITEMS.length); else navigator.clearAppBadge(); } } catch (e) {}
      if (VIEW === 'list' || VIEW === 'ledger') render();
      if (VIEW === 'ledger' && !LED.data) ledLoad();
      qResume();
    }).catch(function (e) { rb.classList.remove('spin'); if (!quiet) toast(e.message, 'bad'); if (!loadedAt && AUTH !== 'pending') app.innerHTML = '<div class="gate"><p>' + esc(e.message) + '</p></div>'; });
  }

  function thumb(img) { return '<span class="thumb">' + IC.box + (img ? '<img src="' + esc(img) + '" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">' : '') + '</span>'; }
  function diffText(it, q) { return it.kind === 'order' && q !== it.qty ? '주문 ' + it.qty + it.unit + '와 달라요 (' + (q > it.qty ? '+' : '') + (q - it.qty) + ')' : ''; }
  /* 1109c MJ '한 화면에 더 많이' — 수량(−/숫자/+)과 버튼을 한 줄에 */
  function controls(it, s, doneLabel) {
    var unit = it.unit || '개', diff = diffText(it, s.qty);
    return (it.kind !== 'new' ? '' : s.photo ? '<div class="pv"><img src="' + s.photo + '" alt="찍은 상품 사진"><span class="ok">사진 준비됐어요</span><button type="button" data-a="photo">다시 찍기</button></div>'
        : '<button type="button" class="photo" data-a="photo">' + IC.cam + '상품 사진 찍기 (선택)</button>')
      + '<div class="row"><span class="step"><button type="button" data-a="minus" aria-label="하나 빼기">−</button>'
      + '<input type="number" inputmode="numeric" pattern="[0-9]*" min="1" max="99999" value="' + s.qty + '" aria-label="가져온 수량 (' + unit + ')" placeholder="수량" data-a="qty"><button type="button" data-a="plus" aria-label="하나 더하기">+</button></span>'
      + '<button type="button" class="done" data-a="done">' + doneLabel + '</button></div>'
      + '<p class="diff"' + (diff ? '' : ' hidden') + '>' + esc(diff) + '</p>'
      + '<p class="err" hidden></p>';
  }
  function cardHtml(it) {
    it.k = it.k || key(it); CUR[it.k] = it;
    var s = ST[it.k] || (ST[it.k] = { qty: it.qty || 1, photo: '' }), ord = it.kind === 'order';
    return '<article class="card' + (it.pick ? ' picked' : '') + '" data-k="' + esc(it.k) + '">'
      + '<div class="head">' + (ord ? '<button type="button" class="tick" data-a="tick" aria-pressed="' + !!it.pick + '" aria-label="챙김">' + IC.check + '<span>챙김</span></button>' : '') + thumb(it.img) + '<div class="tx"><h2>' + (it._new ? '<span class="new">새 주문</span>' : '') + esc(it.name) + '</h2>'
      + (ord ? '<p class="meta">주문 <b>' + it.qty + it.unit + '</b>' + (it.od ? ' · ' + esc(odText(it.od)) : '') + '</p>' : '<p class="meta">주문 없이 가져온 상품</p>') + '</div></div>'
      + controls(it, s, '입고 완료') + '</article>';
  }
  function backBar(title, step) { return '<div class="bar"><button type="button" class="back" data-a="back" aria-label="뒤로">' + IC.back + '</button><div><b>' + esc(title) + '</b>' + (step ? '<small>' + esc(step) + '</small>' : '') + '</div></div>'; }
  function tabs() { return '<div class="seg" role="tablist"><button type="button" role="tab" data-a="tab" data-v="list" aria-selected="' + (VIEW === 'list') + '">입고하기</button><button type="button" role="tab" data-a="tab" data-v="ledger" aria-selected="' + (VIEW === 'ledger') + '">납품 내역</button></div>'; }
  function picked() { return ITEMS.filter(function (it) { return it.pick; }); }

  function render() {
    CUR = {};
    if (AUTH !== 'ok') return;
    var h = '';
    if (VIEW === 'find') {
      h += backBar('주문 안 한 상품 넣기', '① 가져온 상품 찾기');
      h += '<form class="srch" id="srch" role="search"><span class="si">' + IC.search + '</span><input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="상품 이름 일부 (예: 키티)" value="' + esc(Q) + '" aria-label="상품 이름"><button type="submit" class="go">' + (searching ? '찾는 중…' : '찾기') + '</button></form>';
      if (RES) {
        if (RES.length) h += '<p class="count">찾은 상품 <b>' + RES.length + '개</b></p><ul class="res">' + RES.map(function (x, i) {
          return '<li><button type="button" data-a="pick" data-i="' + i + '"' + (x.ord ? ' disabled' : '') + '>' + thumb(x.img) + '<span class="rn">' + esc(x.name) + (x.ord ? '<small>주문이 있어요 · 처음 화면에서 입고해 주세요</small>' : '') + '</span>' + (x.ord ? '' : '<span class="pk">고르기</span>') + '</button></li>';
        }).join('') + '</ul>';
        else h += '<p class="none">"' + esc(Q) + '" 상품이 없어요</p>';
        h += '<div class="newbox"><button type="button" class="big2" data-a="new">' + IC.plus + '찾는 상품이 없어요 · 새 상품 등록</button></div>';
      } else h += '<p class="hint">상품 이름을 두 글자 이상 적고 [찾기]를 눌러 주세요.</p>';
    } else if (VIEW === 'pick' && PICK) {
      h += backBar('주문 안 한 상품 넣기', '② 가져온 수량');
      PICK.kind = 'pick'; PICK.k = 'u:' + key(PICK);
      h += cardHtml(PICK);
    } else if (VIEW === 'new') {
      h += backBar('새 상품 등록', '약국 앱에 새 상품으로 올라가요');
      var it = { k: 'new', kind: 'new', name: '' }; CUR.new = it;
      var s = ST.new || (ST.new = { qty: 1, photo: '' });
      h += '<article class="card" data-k="new">'
        + '<label class="fl" for="nName">상품 이름 <em>필수</em></label><input class="fi" id="nName" maxlength="40" autocomplete="off" value="' + esc(NEWF.name) + '" placeholder="예: 시나모롤 물티슈 20매">'

    var id = ev.target.id;
    if (id === 'cFrom') LED.dFrom = ev.target.value; else if (id === 'cTo') LED.dTo = ev.target.value;   /* 불러오는 중에 다시 그려도 고른 날짜 유지 */
    if (id === 'nName') NEWF.name = ev.target.value; else if (id === 'nNote') NEWF.note = ev.target.value; else if (id === 'q') Q = ev.target.value;
    if (ev.target.getAttribute('data-a') !== 'qty') return;
    var o = itemOf(ev.target), v = parseInt(ev.target.value, 10); if (o && v > 0) { o.s.qty = Math.min(99999, v); o.s.edited = true; var d = o.card.querySelector('.diff'), t = diffText(o.it, o.s.qty); d.hidden = !t; d.textContent = t; }
  });
  app.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'srch') return; ev.preventDefault();
    var q = document.getElementById('q'); Q = q.value.trim(); q.blur();
    if (Q.replace(/\s+/g, '').length < 2) { toast('두 글자 이상 적어 주세요', 'bad'); return; }
    if (searching) return; searching = true; render();
    call('bwSearch', [Q]).then(function (r) {
      searching = false;
      if (authStop(r)) return;
      if (!r || !r.ok) { toast((r && (r.msg || r.__err)) || '찾지 못했어요', 'bad'); render(); return; }
      RES = r.items || []; render();
    }).catch(function (e) { searching = false; render(); toast(e.message, 'bad'); });
  });

  /* 사진: 긴 쪽 1600px · JPEG 0.8 (물류앱 resizeImageFile 과 같음) · 너무 크면 한 번 더 줄임 */
  function resize(file, maxSide, q) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var sc = Math.min(1, maxSide / Math.max(img.width, img.height)), w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', q));
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('사진을 읽지 못했어요. 다시 찍어 주세요.')); };
      img.src = url;
    });
  }
  document.getElementById('cam').addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0], k = camFor; camFor = null;
    if (!f || !k || !ST[k]) return;
    resize(f, 1600, 0.8).then(function (d) { return d.length - d.indexOf(',') - 1 > MAX_B64 ? resize(f, 1200, 0.6) : d; }).then(function (d) {
      if (d.length - d.indexOf(',') - 1 > MAX_B64) throw new Error('사진이 너무 커요. 다시 찍어 주세요.');
      ST[k].photo = d; render();
    }).catch(function (e) { toast(e.message, 'bad'); });
  });

  function complete(o) {
    if (busy) return;
    var it = o.it, s = o.s, inp = o.card.querySelector('input[data-a=qty]'), q = parseInt(inp.value, 10), nm = '';
    if (it.kind === 'new') { nm = NEWF.name.replace(/\s+/g, ' ').trim(); if (!nm) { showErr(o, '상품 이름을 적어 주세요'); document.getElementById('nName').focus(); return; } }
    if (!(q > 0)) { showErr(o, '가져온 수량을 숫자로 적어 주세요'); inp.focus(); return; }
    setQty(o, q);
    if (it.kind === 'order' && s.qty !== it.qty && !confirm('주문은 ' + it.qty + it.unit + '인데 ' + s.qty + it.unit + '로 입고할까요?')) return;
    showErr(o, '');
    if (it.kind === 'order') { optimistic([it]); return; }   /* 1109 주문 온 상품은 바로 반응 (주문 없이·새 상품은 서버 확인이 필요해 그대로) */
    busy = true;
    var btn = o.card.querySelector('.done'), label = btn.textContent; btn.disabled = true; btn.textContent = it.kind === 'new' ? '등록하는 중…' : '보내는 중…';
    var req = it.kind === 'order' ? call('bwInbound', [it.row, it.name, s.qty, '']) : it.kind === 'pick' ? call('bwUnordered', [it.row, it.name, s.qty, '']) : call('bwAddProduct', [{ name: nm, qty: s.qty, photo: s.photo, cat: NEWF.cat, note: NEWF.note.trim() }]);
    req.then(function (r) {
      busy = false;
      if (authStop(r)) return;
      var nmShow = first((r && r.name) || nm || it.name);
      if (r && (r.ok || r.gone) && it.kind === 'order') {
        if (r.ok) { toast('입고 완료! ' + nmShow + ' ' + s.qty + it.unit, 'ok'); LED.data = null; }
        else toast(r.msg || '이미 입고된 상품이에요');
        o.card.classList.add('out');
        setTimeout(function () { ITEMS = ITEMS.filter(function (x) { return x !== it; }); delete ST[it.k]; render(); if (r.gone) load(true); }, 300);
        try { if (navigator.setAppBadge) { if (ITEMS.length > 1) navigator.setAppBadge(ITEMS.length - 1); else navigator.clearAppBadge(); } } catch (e) {}
        return;
      }
      if (r && r.ok) {   /* 주문 없이 · 새 상품 → 처음 화면으로 */
        toast((r.created ? '새 상품 등록 · 입고 완료! ' : '입고 완료! ') + nmShow + ' ' + s.qty + '개', 'ok'); LED.data = null;
        delete ST[it.k]; if (it.kind === 'new') NEWF = { name: '', cat: '', note: '' }; Q = ''; RES = null; PICK = null;
        home(); return;
      }
      btn.disabled = false; btn.textContent = label;
      showErr(o, (r && (r.msg || r.__err)) || '입고가 안 됐어요. 다시 눌러 주세요.');
    }).catch(function (e) { busy = false; btn.disabled = false; btn.textContent = label; showErr(o, e.message); });
  }

  document.getElementById('reload').addEventListener('click', function () { load(); if (VIEW === 'ledger') ledLoad(); });
  window.addEventListener('hashchange', function () { if (/[#&]t=/.test(location.hash)) location.reload(); });   /* 새 링크를 같은 창에서 열면 그 열쇠로 */
  document.addEventListener('visibilitychange', function () { if (document.hidden || busy) return; if (AUTH === 'pending' || (VIEW === 'list' && Date.now() - loadedAt > 30000)) load(true); });   /* 앱으로 돌아오면 새 주문·승인 확인 */
  setInterval(function () { if (!document.hidden && !busy && AUTH === 'ok' && VIEW === 'list' && Date.now() - loadedAt > 240000) load(true); }, 60000);
  try { history.replaceState({ v: 'list', d: 0 }, ''); } catch (e) {}
  /* 크롬 설치 조건용 서비스 워커 (캐시 없이 통과만 · bw.html 만 맡음) */
  try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('bw-sw.js', { scope: './bw.html' }).catch(function () {}); } catch (e) {}
  load();
})();
</script>
</body>
</html>
